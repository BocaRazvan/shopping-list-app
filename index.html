<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping List</title>
    <link rel="stylesheet" href="scss/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />
  </head>

  <body class="d-flex flex-column">
    <section class="d-flex container py-2 justify-content-end border-bottom py-2 mb-3 bg-body-tertiary">
      <div class="d-flex gap-2 align-items-center">
        <small id="userInfo" class="text-muted mb-2"></small>

        <button
          type="button"
          id="darkModeToggle"
          class="btn btn-lg btn-outline-info"
          title="Toggle dark mode"
        >
          <i class="bi bi-lightbulb"></i>
        </button>
        <select
          id="languageSelector"
          class="form-select form-select-lg w-auto align-self-center"
          title="Language"
        >
          <option value="en">EN</option>
          <option value="ro">RO</option>
        </select>
      </div>
    </section>

    <main class="container d-flex flex-column justify-content-evenly align-items-center">
      <div class="d-flex flex-column w-100 gap-4">
        <div class="col-12 col-md-8 col-lg-5 mx-auto entrance-card">
          <a href="newList.html" class="text-decoration-none">
            <div class="card text-center p-4 shadow border border-secondary bg-info-subtle shine-card">
              <i class="bi bi-journal-plus" style="font-size: 3rem; color: var(--bs-primary)"></i>
              <h5 class="mt-3 mb-0" data-i18n="new_list">New List</h5>
            </div>
          </a>
        </div>
        <div class="col-12 col-md-8 col-lg-5 mx-auto entrance-card">
          <a href="viewList.html" class="text-decoration-none">
            <div class="card text-center p-4 shadow border border-secondary bg-info-subtle shine-card">
              <i class="bi bi-journal-check" style="font-size: 3rem; color: var(--bs-primary)"></i>
              <h5 class="mt-3 mb-0" data-i18n="view_lists">View Lists</h5>
            </div>
          </a>
        </div>
      </div>
    </main>

    <section class="d-flex flex-column align-items-end container mt-auto mb-1">
      <div class="d-flex justify-content-end w-100">
        <button type="button" id="logoutBtn" class="btn btn-outline-secondary text-primary">
          <i class="bi bi-box-arrow-right me-1"></i><span data-i18n="log_out">Log Out</span>
        </button>
      </div>
    </section>

    <footer class="container pb-1 border-top page-content mt-3 bg-body-tertiary">
      <div class="container text-center">
        <p class="text-muted mb-1">2026 Shopping List App.</p>
        <p class="small text-muted mb-0">~~ByteBralin~~</p>
      </div>
    </footer>

    <script type="module" src="js/authGuard.js"></script>
    <script type="module" src="js/darkMode.js"></script>
    <script type="module" src="js/languageSelector.js"></script>
  </body>
</html>
