<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping List</title>
    <link rel="stylesheet" href="scss/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <header class="container d-flex align-items-center justify-content-center text-center page-content mt-3">
      <img src="/assets/img/logo.svg" alt="Shopping List Logo" style="width: 180px; height: 180px" />
    </header>

    <main class="container flex-grow-1 d-flex flex-column justify-content-evenly align-items-center">
      <div class="row justify-content-center w-100 g-5">
        <div class="col-12 col-md-8 col-lg-5 entrance-card">
          <a href="newList.html" class="text-decoration-none">
            <div class="card text-center p-4 shadow border border-secondary bg-secondary-subtle">
              <i class="bi bi-journal-plus" style="font-size: 3rem; color: var(--bs-primary)"></i>
              <h5 class="mt-3 mb-0 text-dark">New List</h5>
            </div>
          </a>
        </div>
        <div class="col-12 col-md-8 col-lg-5 entrance-card">
          <a href="viewList.html" class="text-decoration-none">
            <div class="card text-center p-4 shadow border border-secondary bg-secondary-subtle">
              <i class="bi bi-journal-check" style="font-size: 3rem; color: var(--bs-info)"></i>
              <h5 class="mt-3 mb-0 text-dark">View Lists</h5>
            </div>
          </a>
        </div>
      </div>
    </main>

    <section class="d-flex flex-column align-items-end container mb-3">
      <small id="userInfo" class="text-muted mb-2"></small>
      <div class="col-5 col-md-4 col-lg-3">
        <button type="button" id="logoutBtn" class="btn btn-outline-secondary mt-1 text-primary w-100">
          <i class="bi bi-box-arrow-right me-1"></i>Log Out
        </button>
      </div>
    </section>

    <footer class="container mt-5 pb-2 border-top border-secondary page-content mt-auto">
      <div class="container text-center">
        <p class="text-muted mb-1">2026 Shopping List App.</p>
        <p class="small text-muted mb-0">~~ByteBralin~~</p>
      </div>
    </footer>

    <script type="module" src="js/authGuard.js"></script>
  </body>
</html>
