<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New List</title>
    <link rel="stylesheet" href="scss/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />
  </head>

  <body class="d-flex flex-column">
    <section class="d-flex container py-2 justify-content-end mt-3 pe-4 mb-auto">
      <div class="d-flex gap-2 align-items-center">
        <small id="userInfo" class="text-muted mb-2"></small>

        <button
          type="button"
          id="darkModeToggle"
          class="btn btn-lg btn-outline-info"
          title="Toggle dark mode"
        >
          <i class="bi bi-lightbulb"></i>
        </button>
        <select
          id="languageSelector"
          class="form-select form-select-lg w-auto align-self-center"
          title="Language"
        >
          <option value="en">EN</option>
          <option value="ro">RO</option>
        </select>
      </div>
    </section>

    <main class="container d-flex flex-column justify-content-evenly align-items-center">
      <form id="itemForm">
        <div class="d-flex align-items-center mb-2">
          <span class="badge rounded-pill bg-primary me-2">1</span>
          <h6 class="mb-0" data-i18n="step1_title">Fill in item details</h6>
        </div>
        <div class="row mb-2">
          <div class="col-9">
            <label for="itemName" class="form-label" data-i18n="item_name">Item Name</label>
            <input
              type="text"
              class="form-control bg-secondary-subtle"
              id="itemName"
              placeholder="e.g. Milk"
              required
            />
          </div>
          <div class="col-3">
            <label for="itemQuantity" class="form-label" data-i18n="quantity">Qty</label>
            <input
              type="number"
              class="form-control bg-secondary-subtle"
              id="itemQuantity"
              placeholder="e.g. 2"
              min="1"
              required
            />
          </div>
        </div>
        <div class="mb-3">
          <label for="itemPhoto" class="form-label" data-i18n="photo_url">Photo URL (optional)</label>
          <input
            type="url"
            class="form-control bg-secondary-subtle"
            id="itemPhoto"
            placeholder="https://..."
          />
        </div>

        <button type="button" id="addItemBtn" class="btn btn-primary btn-lg w-100 shadow-lg mt-3">
          <i class="bi bi-plus-circle me-2"></i><span data-i18n="add_item">Add Item</span>
        </button>

        <div class="d-flex align-items-center mt-4 mb-3">
          <span class="badge rounded-pill bg-primary me-2">2</span>
          <h6 class="mb-0" data-i18n="step2_title">Add as many items as you need</h6>
        </div>

        <table class="table table-hover align-middle mt-4 shadow-sm rounded table-striped" id="itemsTable">
          <thead class="table-primary">
            <tr>
              <th style="width: 2%" data-i18n="th_number">#</th>
              <th style="width: 60%" data-i18n="th_name">Name</th>
              <th style="width: 10%" data-i18n="th_qty">Qty</th>
              <th style="width: 18%" data-i18n="th_photo">Photo</th>
              <th style="width: 10%"><i class="bi bi-gear-fill"></i></th>
            </tr>
          </thead>
          <tbody id="itemsTableBody">
            <!-- rows will be added here by JavaScript -->
          </tbody>
        </table>

        <p id="noItemsText" class="text-muted text-center" data-i18n="no_items">No items added yet</p>

        <div class="d-flex align-items-center mt-2 pt-3">
          <span class="badge rounded-pill bg-success me-2">3</span>
          <h6 class="mb-0" data-i18n="step3_title">Save your list when you're finished</h6>
        </div>

        <button
          type="button"
          id="saveListBtn"
          class="btn btn-success btn-lg w-100 mt-4"
          disabled
          data-bs-toggle="offcanvas"
          data-bs-target="#saveListOffcanvas"
        >
          <i class="bi bi-check-circle me-2"></i><span data-i18n="save_list">Save List</span>
        </button>
      </form>
    </main>

    <div class="offcanvas offcanvas-bottom h-50" tabindex="-1" id="saveListOffcanvas">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" data-i18n="save_your_list">Save Your List</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body">
        <div class="mb-3">
          <label for="listName" class="form-label" data-i18n="list_name">List Name</label>
          <input type="text" class="form-control bg-secondary-subtle" id="listName" required />
        </div>
        <div class="mb-3">
          <label for="storeLocation" class="form-label" data-i18n="store">Store</label>
          <select class="form-select" id="storeLocation" required>
            <option value="" selected disabled>Choose...</option>
            <option value="Metro">Metro</option>
            <option value="Kaufland">Kaufland</option>
            <option value="Carrefour">Carrefour</option>
            <option value="Lidl">Lidl</option>
            <option value="Profi">Profi</option>
            <option value="Profi">Other...</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="listDate" class="form-label" data-i18n="date">Date</label>
          <input type="date" class="form-control bg-secondary-subtle" id="listDate" disabled required />
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="button" class="btn btn-secondary w-50" data-bs-dismiss="offcanvas" data-i18n="cancel">
            Cancel
          </button>
          <button type="button" id="confirmSaveBtn" class="btn btn-success w-50" data-i18n="ok">OK</button>
        </div>
      </div>
    </div>

    <section class="d-flex flex-column align-items-end container mt-auto mb-1">
      <div class="d-flex justify-content-between w-100">
        <a href="index.html" class="text-decoration-none">
          <button type="button" class="btn btn-secondary">
            <i class="bi bi-arrow-left me-2"></i><span data-i18n="back">Back</span>
          </button>
        </a>
        <button type="button" id="logoutBtn" class="btn btn-outline-secondary text-primary">
          <i class="bi bi-box-arrow-right me-1"></i><span data-i18n="log_out">Log Out</span>
        </button>
      </div>
    </section>

    <footer class="container pb-1 border-top page-content mt-auto">
      <div class="container text-center">
        <p class="text-muted mb-1">2026 Shopping List App.</p>
        <p class="small text-muted mb-0">~~ByteBralin~~</p>
      </div>
    </footer>

    <div class="modal fade" id="photoModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" data-i18n="photo_modal_title">Item Photo</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body text-center">
            <img id="photoModalImg" src="" alt="Item photo" class="img-fluid rounded" />
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="js/authGuard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/firebaseConfig.js"></script>
    <script type="module" src="js/addItem.js"></script>
    <script type="module" src="js/dateRestrict.js"></script>
    <script type="module" src="js/saveList.js"></script>
    <script type="module" src="js/darkMode.js"></script>
    <script type="module" src="js/languageSelector.js"></script>
  </body>
</html>
