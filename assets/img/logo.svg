<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching app theme -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fe218b"/>
      <stop offset="100%" stop-color="#21b0fe"/>
    </linearGradient>

    <!-- Basket Gradient -->
    <linearGradient id="basketGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f8f9fa" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="250" cy="250" r="210" fill="url(#bgGradient)" filter="url(#dropShadow)" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="250" cy="250" r="185" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" />

  <!-- Shopping Basket Graphics Group -->
  <g transform="translate(0, 15)" filter="url(#dropShadow)">
    
    <!-- Basket Handle -->
    <path d="M 175 145 C 175 80, 325 80, 325 145" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="18" 
          stroke-linecap="round"/>

    <!-- Basket Body -->
    <path d="M 140 145 L 360 145 L 330 310 C 328 322, 318 330, 305 330 L 195 330 C 182 330, 172 322, 170 310 Z" 
          fill="url(#basketGradient)"/>

    <!-- Basket Weave Pattern Lines (Vertical) -->
    <path d="M 210 145 L 215 310 M 250 145 L 250 310 M 290 145 L 285 310" 
          stroke="#e9ecef" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-opacity="0.7"/>

    <!-- Basket Weave Pattern Lines (Horizontal) -->
    <path d="M 152 200 L 348 200 M 161 255 L 339 255" 
          stroke="#e9ecef" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-opacity="0.7"/>
  </g>

  <!-- Floating Checklist Document Badge -->
  <g transform="translate(265, 235)" filter="url(#dropShadow)">
    <!-- Paper Background -->
    <rect x="0" y="0" width="130" height="150" rx="14" fill="#ffffff" />
    
    <!-- Checkmark 1 -->
    <circle cx="30" cy="45" r="12" fill="#21b0fe" />
    <path d="M 24 45 L 28 49 L 38 39" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="52" y1="45" x2="102" y2="45" stroke="#ced4da" stroke-width="6" stroke-linecap="round" />

    <!-- Checkmark 2 -->
    <circle cx="30" cy="85" r="12" fill="#fe218b" />
    <path d="M 24 85 L 28 89 L 38 79" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="52" y1="85" x2="92" y2="85" stroke="#ced4da" stroke-width="6" stroke-linecap="round" />

    <!-- Empty Checkbox 3 -->
    <circle cx="30" cy="125" r="11" fill="none" stroke="#adb5bd" stroke-width="4" />
    <line x1="52" y1="125" x2="82" y2="125" stroke="#ced4da" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
