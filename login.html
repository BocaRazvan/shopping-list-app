<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="scss/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />
  </head>

  <body class="d-flex flex-column auth-checked">
    <div id="loadingOverlay" class="d-none">
      <span class="loading-text">Please wait...</span>
    </div>

    <section class="d-flex container justify-content-end border-bottom py-2 mb-3">
      <div class="d-flex gap-2 align-items-center">
        <button
          type="button"
          id="darkModeToggle"
          class="btn btn-lg btn-outline-info"
          title="Toggle dark mode"
        >
          <i class="bi bi-lightbulb"></i>
        </button>
        <select
          id="languageSelector"
          class="form-select form-select-lg w-auto align-self-center"
          title="Language"
        >
          <option value="en">EN</option>
          <option value="ro">RO</option>
        </select>
      </div>
    </section>

    <div class="d-flex align-items-center justify-content-center">
      <div class="row justify-content-center w-100">
        <div class="col-12 col-md-8 col-lg-5">
          <h1 class="text-center fw-bold display-5 gradient-text" data-i18n="login_title">
            Create lists, add items, and more!
          </h1>
        </div>
      </div>
    </div>

    <main class="container d-flex flex-column justify-content-center align-items-center page-content">
      <div class="row justify-content-center w-100">
        <div class="col-12 col-md-8 col-lg-5 login-card">
          <form id="loginForm">
            <p class="text-muted text-center">
              <span class="typewriter-text" data-i18n="login_subtitle"
                >Enter your credentials to log in.</span
              >
            </p>
            <div class="mb-2">
              <label for="loginEmail" class="form-label" data-i18n="email">Email</label>
              <input type="email" class="form-control bg-secondary-subtle" id="loginEmail" required />
            </div>
            <div class="mb-5">
              <label for="loginPassword" class="form-label" data-i18n="password">Password</label>
              <div class="input-group">
                <input type="password" class="form-control bg-secondary-subtle" id="loginPassword" required />
                <button
                  type="button"
                  class="btn bg-primary-subtle text-primary-emphasis border border-primary-subtle"
                  id="togglePassword"
                >
                  <i class="bi bi-eye" id="toggleIcon"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bolder pulsate-btn">
              <span class="d-inline-block">
                <i class="bi bi-box-arrow-in-right me-2 fs-3 me-3"></i><span data-i18n="log_in">Log In</span>
              </span>
            </button>
            <div class="position-relative">
              <p
                id="loginError"
                class="text-center mt-3 d-none position-absolute w-100 mb-0 fs-5 pulsate-error"
              ></p>
            </div>
          </form>
        </div>
      </div>
      <div class="d-flex flex-column align-items-end container mt-3 mb-3">
        <div class="col-12 col-md-8 col-lg-5">
          <a
            href="#"
            id="forgotPasswordLink"
            class="text-decoration-none text-warning"
            data-i18n="forgot_password"
            >Forgot password?</a
          >
        </div>
      </div>
    </main>

    <footer class="container pb-1 border-top page-content mt-auto">
      <div class="container text-center">
        <p class="text-muted mb-1">2026 Shopping List App.</p>
        <p class="small text-muted mb-0">~~ByteBralin~~</p>
      </div>
    </footer>

    <script type="module" src="js/firebaseConfig.js"></script>
    <script type="module" src="js/login.js"></script>
    <script type="module" src="js/darkMode.js"></script>
    <script type="module" src="js/languageSelector.js"></script>
  </body>
</html>
