<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Lists</title>
    <link rel="stylesheet" href="scss/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />
  </head>

  <body class="d-flex flex-column">
    <section class="d-flex container py-2 justify-content-end mt-3 pe-4 mb-auto">
      <div class="d-flex gap-2 align-items-center">
        <small id="userInfo" class="text-muted mb-2"></small>

        <button
          type="button"
          id="darkModeToggle"
          class="btn btn-lg btn-outline-info"
          title="Toggle dark mode"
        >
          <i class="bi bi-lightbulb"></i>
        </button>
        <select
          id="languageSelector"
          class="form-select form-select-lg w-auto align-self-center"
          title="Language"
        >
          <option value="en">EN</option>
          <option value="ro">RO</option>
        </select>
      </div>
    </section>

    <main class="container d-flex flex-column justify-content-evenly align-items-center">
      <div class="row justify-content-center w-100">
        <div class="col-12 col-md-10 col-lg-7">
          <div id="listsContainer" class="d-flex flex-column gap-3">
            <!-- list cards will be inserted here by JavaScript -->
          </div>
        </div>
      </div>
    </main>

    <section class="d-flex flex-column align-items-end container mt-auto mb-1">
      <div class="d-flex justify-content-between w-100">
        <a href="index.html" class="text-decoration-none">
          <button type="button" class="btn btn-secondary">
            <i class="bi bi-arrow-left me-2"></i><span data-i18n="back">Back</span>
          </button>
        </a>
        <button type="button" id="logoutBtn" class="btn btn-outline-secondary text-primary">
          <i class="bi bi-box-arrow-right me-1"></i><span data-i18n="log_out">Log Out</span>
        </button>
      </div>
    </section>

    <footer class="container pb-1 border-top page-content mt-auto">
      <div class="container text-center">
        <p class="text-muted mb-1">2026 Shopping List App.</p>
        <p class="small text-muted mb-0">~~ByteBralin~~</p>
      </div>
    </footer>

    <div class="modal fade" id="photoModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" data-i18n="photo_modal_title">Item Photo</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body text-center">
            <img id="photoModalImg" src="" alt="Item photo" class="img-fluid rounded" />
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="js/authGuard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/viewLists.js"></script>
    <script type="module" src="js/darkMode.js"></script>
    <script type="module" src="js/languageSelector.js"></script>
  </body>
</html>
